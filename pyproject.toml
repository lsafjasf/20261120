[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apng-lossless-webp"
version = "0.1.0"
description = "Rebuild APNG frames and convert them to verified lossless animated WebP"
requires-python = ">=3.10"

[project.scripts]
apng-webp = "apng_webp.cli:main"

[tool.setuptools.packages.find]
include = ["apng_webp*"]
