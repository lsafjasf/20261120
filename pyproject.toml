[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcp-qc"
version = "0.1.0"
description = "Offline DCP package quality checker with reel timelines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "dcp-qc contributors"}]
dependencies = []

[project.scripts]
dcp-qc = "dcp_qc.cli:main"

[tool.setuptools.packages.find]
include = ["dcp_qc*"]
