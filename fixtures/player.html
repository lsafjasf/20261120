<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>WebVTT layout harness</title>
  <style>
    video { width: 100%; aspect-ratio: 16 / 9; background: #0b0f16; }
  </style>
</head>
<body>
  <!-- The declared frame rate lives on the script tag itself. -->
  <script type="text/vtt" data-fps="25" id="embedded-vtt">
WEBVTT

REGION
id:newsroll
width:40%
lines:3
regionanchor:0%,100%
viewportanchor:0%,100%
scroll:up

cue7
00:00:00.000 --> 00:00:08.000 region:newsroll
Ticker line one enters

cue8
00:00:02.000 --> 00:00:08.000 region:newsroll
Ticker line two pushes up

cue9
00:00:04.000 --> 00:00:08.000 region:newsroll
Ticker line three starts clipping

cue10
00:00:05.000 --> 00:00:09.000 region:newsroll
Ticker line four keeps clipping

cue1
00:00:00.000 --> 00:00:04.000 position:10% align:start size:42%
Lower third title that must wrap inside its explicit size box

cue3
00:00:02.500 --> 00:00:05.500 position:90% align:end size:35% line:0
Right top breaking news banner

cue4
00:00:03.000 --> 00:00:07.000
Automatic placement moves upward while other cues occupy bottom slots
  </script>
  <video controls crossorigin="anonymous">
    <track kind="subtitles" src="sample.vtt" srclang="en" default>
  </video>
</body>
</html>
